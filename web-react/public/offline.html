<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noor — Hors ligne</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
        font-family: Roboto, system-ui, sans-serif;
        color: #374151;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      h1 { color: #2A9849; margin-bottom: 8px; }
      p { font-size: 14px; color: #6b7280; }
      button {
        margin-top: 16px;
        background: #2A9849;
        color: white;
        border: none;
        border-radius: 999px;
        padding: 10px 24px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Noor</h1>
      <p>Vous êtes hors ligne. Vérifiez votre connexion internet et réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
